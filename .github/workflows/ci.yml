name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Enforce zero external dependencies
        shell: bash
        run: |
          if grep -Eq '^\s*require\b' go.mod; then
            echo "go.mod must remain zero-dependency!"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests (Linux with -race)
        if: runner.os == 'Linux'
        run: go test -v -race ./...

      - name: Run tests
        if: runner.os != 'Linux'
        run: go test -v ./...

      - name: Build and smoke-test fixtures
        shell: bash
        run: |
          BIN=./gitwasp
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=./gitwasp.exe
          fi
          go build -o "$BIN" ./cmd/gitwasp
          "$BIN" version
          "$BIN" scan ./testdata/safe-repo

          set +e
          "$BIN" scan ./testdata/malicious-repo
          CODE=$?
          set -e
          if [ "$CODE" -ne 2 ]; then
            echo "Expected exit code 2 on malicious-repo, got $CODE"
            exit 1
          fi
